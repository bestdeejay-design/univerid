<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Страница не найдена — UniverID</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23a855f7' d='M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l4-2.18L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z'/></svg>" type="image/svg+xml">
  <link rel="stylesheet" href="/css/site.css">
  <style>
    .error-page { min-height:100vh; display:grid; place-items:center; padding:28px 0; background:radial-gradient(circle at 75% 18%,rgba(69,104,232,.12),transparent 28%),var(--brand-paper); }
    .error-card { width:min(620px,100%); padding:clamp(25px,6vw,52px); border:1px solid var(--brand-line); border-radius:26px; background:#fff; box-shadow:var(--brand-shadow); }
    .error-code { color:var(--brand-blue); font-size:12px; font-weight:850; letter-spacing:.15em; text-transform:uppercase; }
    .error-card h1 { margin:12px 0; color:var(--brand-ink); font-size:clamp(36px,7vw,58px); line-height:1; letter-spacing:-.07em; }
    .error-card p { max-width:470px; margin:0; color:var(--brand-muted); font-size:15px; line-height:1.65; }
    .error-actions { display:flex; flex-wrap:wrap; gap:9px; margin-top:22px; }
  </style>
</head>
<body>
  <main class="error-page">
    <section class="container error-card" aria-labelledby="errorTitle">
      <a class="brand-lockup" href="/" aria-label="На главную UniverID"><span class="brand-mark" aria-hidden="true"><svg class="brand-mark-icon" viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l4-2.18L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/></svg></span><span class="brand-name">Univer<span>ID</span></span></a>
      <div class="error-code" style="margin-top:30px">Ошибка 404 · маршрут не найден</div>
      <h1 id="errorTitle">Такой страницы нет</h1>
      <p>Возможно, адрес изменился. Вернитесь к обзору проекта или откройте короткий питч и демонстрационные материалы.</p>
      <div class="error-actions">
        <a class="btn btn-primary" href="/">На главную</a>
        <a class="btn btn-secondary" href="/docs/presentation.html">Короткий питч</a>
        <a class="btn btn-secondary" href="/partner-demo.html">Демо компании</a>
      </div>
    </section>
  </main>
</body>
</html>

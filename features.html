<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniverID — Все возможности | AXIIOM</title>
  <meta name="description" content="20 модулей UniverID для студентов, выпускников, преподавателей, абитуриентов, родителей и администрации">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b12;
      --bg-card: #14141f;
      --bg-light: #1c1c2e;
      --primary: #6366f1;
      --primary-light: #818cf8;
      --text: #f1f1f7;
      --text-muted: #8b8ba0;
      --border: rgba(255,255,255,0.06);
      --success: #22c55e;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
    }
    .page { max-width:1200px; margin:0 auto; padding:60px 24px 100px; }
    .header { text-align:center; margin-bottom:56px; }
    .header h1 { font-size:36px; font-weight:800; margin-bottom:12px; background:linear-gradient(135deg,#6366f1,#a855f7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .header p { color:var(--text-muted); font-size:15px; max-width:540px; margin:0 auto; line-height:1.6; }
    .header .badge {
      display:inline-flex; align-items:center; gap:6px;
      padding:6px 14px; border-radius:20px;
      background:rgba(99,102,241,0.15);
      color:var(--primary-light);
      font-size:13px; font-weight:500;
      margin-bottom:20px;
    }
    .header .badge svg { width:16px; height:16px; }

    .cat-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
      gap:16px;
    }
    .cat-card {
      background:var(--bg-card);
      border-radius:16px;
      padding:24px;
      cursor:pointer;
      transition:all .3s cubic-bezier(.4,0,.2,1);
      border:1px solid transparent;
      position:relative;
      overflow:hidden;
    }
    .cat-card::before {
      content:'';
      position:absolute; top:0; left:0; right:0; height:3px;
      background:linear-gradient(90deg,var(--primary),var(--primary-light));
      opacity:0;
      transition:opacity .3s;
    }
    .cat-card:hover {
      border-color:rgba(99,102,241,0.3);
      transform:translateY(-4px);
      box-shadow:0 12px 40px rgba(99,102,241,0.12);
    }
    .cat-card:hover::before { opacity:1; }
    .cat-card .icon { width:36px; height:36px; color:var(--primary-light); margin-bottom:14px; display:block; }
    .cat-card h3 { font-size:16px; font-weight:600; margin-bottom:8px; }
    .cat-card .cat-preview { font-size:13px; color:var(--text-muted); line-height:1.5; }
    .cat-card .cat-count {
      display:inline-flex; align-items:center; gap:4px;
      margin-top:14px;
      font-size:12px; color:var(--primary-light); font-weight:500;
    }
    .cat-card .cat-count svg { width:14px; height:14px; }

    .modal-overlay {
      position:fixed; inset:0;
      background:rgba(0,0,0,0.75);
      z-index:1000;
      display:none;
      align-items:center;
      justify-content:center;
      padding:24px;
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
    }
    .modal-overlay.open { display:flex; }
    .modal {
      background:var(--bg-card);
      border-radius:20px;
      border:1px solid var(--border);
      max-width:560px;
      width:100%;
      max-height:80vh;
      overflow-y:auto;
      padding:36px 32px;
      position:relative;
      animation:modalIn .3s ease;
    }
    @keyframes modalIn {
      from { opacity:0; transform:scale(.95) translateY(10px); }
      to { opacity:1; transform:scale(1) translateY(0); }
    }
    .modal-close {
      position:absolute; top:16px; right:16px;
      width:36px; height:36px;
      border-radius:50%;
      border:none;
      background:var(--bg-light);
      color:var(--text-muted);
      cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:all .2s;
    }
    .modal-close:hover { background:rgba(255,255,255,0.1); color:var(--text); }
    .modal-close svg { width:20px; height:20px; }
    .modal .icon { width:40px; height:40px; color:var(--primary-light); margin-bottom:14px; display:block; }
    .modal h2 { font-size:22px; font-weight:700; margin-bottom:6px; }
    .modal .modal-sub { color:var(--text-muted); font-size:14px; margin-bottom:24px; }
    .modal ul { list-style:none; padding:0; }
    .modal li {
      padding:12px 0;
      border-bottom:1px solid var(--border);
      font-size:14px; line-height:1.5;
      display:flex; align-items:flex-start; gap:10px;
    }
    .modal li:last-child { border-bottom:none; }
    .modal li::before {
      content:'';
      width:6px; height:6px;
      border-radius:50%;
      background:var(--primary);
      flex-shrink:0;
      margin-top:7px;
    }

    .back-link {
      display:inline-flex; align-items:center; gap:6px;
      padding:8px 16px;
      background:rgba(255,255,255,0.04);
      border:1px solid var(--border);
      border-radius:20px;
      color:var(--text-muted);
      font-size:13px;
      text-decoration:none;
      transition:all .2s;
      margin-bottom:40px;
    }
    .back-link:hover {
      background:rgba(255,255,255,0.08);
      color:var(--text);
    }
    .back-link svg { width:16px; height:16px; }

    .footer-links {
      display:flex;
      gap:12px;
      justify-content:center;
      margin-top:48px;
      flex-wrap:wrap;
    }
    .footer-links a {
      display:inline-flex; align-items:center; gap:6px;
      padding:10px 20px;
      border-radius:50px;
      font-size:14px; font-weight:500;
      text-decoration:none;
      transition:all .2s;
    }
    .footer-links .btn-primary {
      background:var(--primary);
      color:#fff;
    }
    .footer-links .btn-primary:hover { background:var(--primary-light); }
    .footer-links .btn-secondary {
      background:var(--bg-card);
      border:1px solid var(--border);
      color:var(--text);
    }
    .footer-links .btn-secondary:hover { border-color:var(--primary); }
    .footer-links svg { width:16px; height:16px; }

    @media (max-width:768px) {
      .header h1 { font-size:26px; }
      .page { padding:40px 16px 80px; }
      .cat-grid { grid-template-columns:1fr; }
      .modal { padding:24px 20px; }
    }
  </style>
</head>

const ICON_MAP = {
  shield:'icon-shield', book:'icon-book', calendar:'icon-calendar',
  chat:'icon-chat', briefcase:'icon-briefcase', grad:'icon-grad',
  trophy:'icon-trophy', target:'icon-target', school:'icon-school',
  chart:'icon-chart', 'wallet-giftcard':'icon-wallet-giftcard',
  building:'icon-building', hospital:'icon-hospital', globe:'icon-globe',
  beaker:'icon-beaker', leaf:'icon-leaf', megaphone:'icon-megaphone',
  union:'icon-union', handshake:'icon-handshake', robot:'icon-robot'
};

const gridEl = document.getElementById('catGrid');
const overlay = document.getElementById('modalOverlay');
const modalIcon = document.getElementById('modalIcon');
const modalTitle = document.getElementById('modalTitle');
const modalSub = document.getElementById('modalSub');
const modalList = document.getElementById('modalList');

CATEGORIES.forEach(cat => {
  const c = document.createElement('div');
  c.className = 'cat-card';
  c.innerHTML =
    '<svg class="icon"><use href="#' + ICON_MAP[cat.icon] + '"/></svg>' +
    '<h3>' + cat.title + '</h3>' +
    '<div class="cat-preview">' + cat.preview + '</div>' +
    '<span class="cat-count">' + cat.count + ' возможностей <svg><use href="#icon-arrow"/></svg></span>';
  c.onclick = () => openModal(cat);
  gridEl.appendChild(c);
});

function openModal(cat) {
  const u = document.createElementNS('http://www.w3.org/2000/svg','use');
  u.setAttributeNS('http://www.w3.org/1999/xlink','href','#'+ICON_MAP[cat.icon]);
  modalIcon.innerHTML = '';
  modalIcon.appendChild(u);
  modalTitle.textContent = cat.title;
  modalSub.textContent = cat.sub;
  modalList.innerHTML = cat.items.map(i => '<li>' + i + '</li>').join('');
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
</script>
